<!DOCTYPE html>
<html>
    <head>
        <title>Daarul Quran Wat Tawheed</title>
        <style>
            header{
                text-align:center;
                
            }
            img{
                border-radius:100px;
            }
            h1{
    color:#006400;
            }
            body{
                background:linear-gradient(to bottom, #E8F5E9, #C8E6C9);
                color:#222222;
                text-align:center;
            }
            .container{
                width: 400px;
                color:black;
                background-color:#F5F5F5;
                margin: auto;
                border-radius:10px;
                margin-top:30px;
                
            }
            .container1{
                width:400px;
                color:#222222;
                background-color:#F5F5F5;
                margin:auto;
                border-radius:20px;
            }
            input{
                width:80%;
                margin: 10px auto;
                border:none;
                border:1px solid lightgray;
                padding: 10px;
                border-radius:5px
            }
            .container,.container1{
                width:90%;
                max-width:300px;
                padding:20px;
            }
            .submit{
                background-color:#006400;
                padding:10px 50px;
                border-radius:30px;
                cursor:pointer;
                border:none;
                color:white;
            }
            em{
                margin-top:10px;
                color:gray;
            }
            
        </style>
    </head>
    <body>
        <header><img src="https://i.ibb.co/HfBkrFp6/IMG-20260624-WA0001.jpg" alt="logo" width="80"></header>
        <h1>Daarul Quran Wat-Tawheed Madrasah</h1>
        <em>motto: people of the Quran, people of Allah and His specialties</em>
        <div class="container">
            <p>A place where students grow in wisdom, discipline, and devotion while preparing for success in life and the Hereafter.</p>
        </div>
        <div><p>To enroll,  fill the below form and click "submit"</p></div>
        <div class="container1">
         <form>
             <label for="i">Name:</label>
             <input id="i" placeholder="enter your name"><br>
             <label for="ii">Child's Name:</label>
             <input id="ii" placeholder="enter the child's name"><br>
             <label for="iii">Phone No:</label>
             <input id="iii" type="number" placeholder="enter your phone number"><br>
             <button class="submit">Submit</button> 
         </form>
         
        </div>
    </body>
</html>

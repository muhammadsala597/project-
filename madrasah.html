<!DOCTYPE html>
<html>
    <head>
        <title>Daarul Quran Wat Tawheed</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <style>
            header{
                text-align:center;
                
            }
            img{
                border-radius:90px;
            }
            h1{
    color:#006400;
            }
            body{
                background:linear-gradient(to bottom, #E8F5E9, #C8E6C9);
                color:#222222;
                text-align:center;
            }
            .container{
                width: 400px;
                color:black;
                background-color:#F5F5F5;
                margin: auto;
                border-radius:10px;
                margin-top:30px;
                
            }
            .container1{
                width:400px;
                color:#222222;
                background-color:#F5F5F5;
                margin:auto;
                border-radius:20px;
            }
            input{
                width:80%;
                margin: 10px auto;
                border:none;
                border:1px solid lightgreen;
                padding: 10px;
                border-radius:5px;
                text-align:center;
            }
            .container,.container1{
                width:90%;
                max-width:500px;
                padding:20px;
            }
            .v{
                background-color:#006400;
                padding:10px 50px;
                border-radius:30px;
                cursor:pointer;
                color:white;
                border:none;                     
            }
            select{
                width:86%;
                border:none;
                padding:10px;
                border:1px solid lightgreen;
                border-radius:5px;
                margin:10px auto;
            }
            label{
                display:block;
                margin-top:10px;
            }
        </style>
    </head>
    <body>
        <header><img src="https://i.ibb.co/HfBkrFp6/IMG-20260624-WA0001.jpg" alt="logo" width="70"></header>
        <h1>Daarul Quran Wat-Tawheed Madrasah</h1>
        <div class="container">
            <p>Nurturing young minds with the light of the Quran and Sunnah, building strong character, sound knowledge, and a lifelong love for Islam.</p>
        </div>
        <div><p>To enroll,  fill the below form and click "submit"</p></div>
        <div class="container1">
         <form>
             <label for="i">Name:</label>
             <input id="i" placeholder="Enter your name" name="pn" required><br>
             <label for="ii">Child's Name:</label>
             <input id="ii" placeholder="Enter the child's name" name="cn" required><br>
             <label for="iii">Phone No:</label>
             <input id="iii" type="tel" placeholder="Enter your phone number" name="tel" required><br>
             <label for="iv">Gender:</label>
             <select id="iv" name="sex">
                 <option> Male </option>
                 <option> Female </option>
             </select>
             <input type="submit" class="v">
         </form>
        </div>
        <footer>
    <p>© 2026 Daarul Quran Wat-Tawheed Madrasah. All Rights Reserved.</p>
</footer>
    </body>
</html>

<!DOCTYPE html>
<html>
    <head>
        <title>facebook clone</title>
        <style>
            body{
                background-color:white;
                text-align:center;
            }
            header{
                margin:20px;
                color:lightblue;
                text-align:left;
            }
            .container{
                background-color:white;
                border-radius:10px;
                width:382px;
                padding:20px;
                margin:20px auto;
            }
            input{
                padding:10px 80px;
                border:1px solid lightgray;
                border-radius:10px;
                margin:7px
            }
            #btn1 button{
                background-color:blue;
                color:white;
                margin-top:7px;
                margin-bottom:10px;
                padding:12px 170px;
                border:none;
                border-radius:30px;
                cursor:pointer; 
            }
            #btn2 button{
                margin:7px;
                border:none;
                background-color:white;
                cursor:pointer;
            }
            #btn3 button{
                border:3px solid lightblue;
                background-color:white;
                color:blue;
                margin-top:170px;
                padding:12px 120px;
                border-radius:30px;
                cursor:pointer;
            }
            footer{
                color:#30396054;
                text-align:center;
                margin-top:80px
            }
        </style>
    </head>
    <body>
       <header>Get facebook for android <a href="https://play.google.com/store/apps/details?id=com.facebook.katana">here</a> and browse faster</header>
      <div class="container">
        <h1><img src="https://i.ibb.co/0RFR000y/DUi-Og0m-JTjz.webp" alt="facebook logo" width="70"/></h1><br>
        <div><input type="text" placeholder="mobile number or email address">
        </div>
        <div><input type="password" placeholder="password"></div>
        <div id="btn1"><a href="https://www.facebook.com/login"><button>Log in</button></a></div>
        <div id="btn2"><a href="https://www.facebook.com/forgotpassword"><button>Forgotten password?</button></a></div>
        <div id="btn3"><a href="https://www.youtube.com/watch?v=dQw4w9WgXcQ"><button>Create new account</button></div>
      </div>
      <footer>© Muhammad</footer>
    </body>
</html>

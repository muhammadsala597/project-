<!DOCTYPE html>
<html>
    <head>
        <title>JAMB</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <style>            
          body{
              background-image:url("https://i.ibb.co/KjbqHtF1/3.webp");
        
          }
          .container,.container1{
              width:300px;
              text-align:center;
              margin:auto;
              background:rgba(255, 255, 255, 0.5);
              padding:10px;
          }
          input{
              margin:10px;
              padding:8px;
              border:1px solid lightgray;
              width:230px;
          } 
          .login{
              width:245px;
              padding:8px;
              margin:10px;
              background-color:#5BC0DE;
              border:none;
              margin-bottom:40px;
          }
          h2{
              margin-top:30px;
              font-weight:200;
          }
          .passwordreset{
              color:#5BC0DE;
              text-align:left;
          }
          a{
              text-decoration:none;
          }
          footer{
              color:green;
              margin-top:30px;
              text-align:center;
          }
          .password{
              width:66%;
              margin:auto;
          }
          button{
              background-color:#ffffff;
              border:1px solid lightgray;
              height:35px;
              cursor:pointer;
          }
        </style>
    </head>
    <body>
        <div class="container">
            <img src="https://i.ibb.co/zHLNZCBx/images-1.webp" alt="jamb logo">
        </div>
        <div class="container1">
           <h2>Login to your<br> account</h2>
           <form>
               <input type="email" placeholder="✉️ e-Mail Address" required><br>
               <input type="password" placeholder="🔒 Password" required class="password" id="or"><button type="button" onclick="togglePassword()" id="toggle">👁️</button><br>
               <button type="submit" class="login"> Log in </button>
           </form>
           <p class="passwordreset">Forgot password? Click <a href="https://www.jambefacility.edu.ng">here</a> to reset it</p> 
        </div>
        <footer><small>2026 © joint admissions and matriculations board (JAMB)</small></footer>
    </body>
    <script>
    function togglePassword(){
        let or = document.getElementById("or")
        let toggle = document.getElementById("toggle")
        if (or.type === "text"){
        or.type = "password"
        toggle.textContent ="👁️"
        }
        else{
            or.type = "text"
            toggle.textContent = "🙈"
        }
        }
    </script>
</html>

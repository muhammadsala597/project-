<!DOCTYPE html>
<html>
    <head>
        <title>JAMB</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <style>            
          body{
              background-image:url("https://i.ibb.co/KjbqHtF1/3.webp");
              display:flex;
              flex-direction:column;
              align-items:center;
        
          }
          .container,.container1{
              width:300px;
              text-align:center;
              margin:auto;
              background:rgba(255, 255, 255, 0.5);
              padding:10px;
          }
          input{
              margin:10px;
              padding:8px;
              border:1px solid lightgray;
              width:230px;
          } 
          .password-container{
              display:flex;
              justify-content:center;
              align-items:center;
              gap:5px;
              margin:10px auto;
          }
          .password-input{
              width: 195px;
              padding:8px;
              border:1px solid lightgray;
              margin-right:0;
              margin:auto;
          }
          .password{
              width: 34px;
              height: 33px;
              margin-left:0;
              margin:auto;
              cursor:pointer;
              border:1px solid lightgray;
              background-color: white;
          }
          .login{
              width:245px;
              padding:8px;
              margin:10px;
              background-color:#5BC0DE;
              border:none;
              margin-bottom:40px;
              cursor:pointer;
          }
          h2{
              margin-top:30px;
              font-weight:200;
          }
          .passwordreset{
              color:#5BC0DE;
              text-align:left;
          }
          a{
              text-decoration:none;
          }
          footer{
              color:green;
              margin-top:30px;
              text-align:center;
          }
        </style>
    </head>
    <body>
        <div class="container">
            <img src="https://i.ibb.co/zHLNZCBx/images-1.webp" alt="jamb logo">
        </div>
        <div class="container1">
           <h2>Login to your<br> account</h2>
           <form>
               <input type="email" placeholder="✉️ e-Mail Address" required><br>
               <div class="do"><input type="password" placeholder="🔒 Password" required class="password-input"><button class="password" type="button">👁️‍🗨️</button></div><br>
               <button type="submit" class="login"> Log in </button>
           </form>
           <p class="passwordreset">Forgot password? Click <a href="https://www.jambefacility.edu.ng" target="blank">here</a> to reset it</p> 
        </div>
        <footer><small>2026 © Joint Admissions and Matriculations Board (JAMB)</small></footer>
    </body>
</html>
